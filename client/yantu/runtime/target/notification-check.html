<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>研途通知连接</title>
    <script src="workspace-context.js"></script>
    <style>
        :root { color-scheme: light; font-family: system-ui, sans-serif; color: #25332e; background: #f5f7f6; }
        * { box-sizing: border-box; letter-spacing: 0; }
        body { margin: 0; padding: 24px 16px; }
        main { max-width: 680px; margin: auto; }
        header { display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #d6dfda; padding-bottom: 16px; }
        h1 { font-size: 22px; margin: 0; }
        small { display: block; margin-top: 4px; color: #586b61; }
        dl { margin-block: 20px; }
        dl > div { display: grid; grid-template-columns: 104px minmax(0,1fr); gap: 12px; border-bottom: 1px solid #d6dfda; padding: 14px 0; }
        dt { color: #586b61; } dd { margin: 0; overflow-wrap: anywhere; }
        form { margin-block: 20px; } label { display: block; margin-bottom: 10px; }
        input { width: 100%; min-height: 44px; border: 1px solid #aabbb2; padding: 10px; font: inherit; border-radius: 4px; }
        button, a { display: inline-flex; min-height: 44px; align-items: center; justify-content: center; font: inherit; padding: 10px 16px; border-radius: 4px; }
        button { background: #27734e; color: white; border: 1px solid #27734e; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        a { color: #176b8d; }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; }
        pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.65 system-ui, sans-serif; padding-block: 16px; border-block: 1px solid #d6dfda; }
        :focus-visible { outline: 3px solid #167ca2; outline-offset: 3px; }
        [hidden] { display: none !important; }
    </style>
</head>
<body>
<main>
    <header><img src="/icons/icon-192.png" width="36" height="36" alt="研途" /><div><h1>研途通知连接</h1><small>通知诊断 20261015.2</small></div></header>
    <dl>
        <div><dt>安全连接</dt><dd id="secure"></dd></div>
        <div><dt>电脑连接</dt><dd id="computer">检查中</dd></div>
        <div><dt>本机权限</dt><dd id="permission"></dd></div>
        <div><dt>本机订阅</dt><dd id="subscription">未检查</dd></div>
    </dl>
    <form id="pairForm" hidden><label>电脑配对码<input id="code" inputmode="numeric" autocomplete="off" maxlength="8" required /></label><button type="submit">连接电脑</button></form>
    <div class="actions"><button id="subscribe" disabled>开启浏览器通知</button><a href="yantu://reminders">APK 本机提醒</a><a href="/downloads/yantu_android_001.apk" download>安卓安装包</a><a href="/mobile?view=notifications">返回研途</a></div>
    <pre id="detail" role="status" aria-live="polite">正在检查</pre>
</main>
<script>
(() => {
    const el = id => document.getElementById(id);
    let config, registration, busy = false;
    const supported = isSecureContext && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
    el('secure').textContent = isSecureContext ? '已启用 HTTPS' : '未启用';
    const permission = () => el('permission').textContent = !('Notification' in window) ? '浏览器不支持' : ({granted: '已允许', denied: '已拒绝', default: '尚未授权'}[Notification.permission] || '未知');
    function failed(stage, error) {
        el('detail').textContent = stage + '失败\n' + (error.name || 'Error') + ': ' + String(error.message || error).replace(/https?:\/\/\S+/gi, '[服务地址]').slice(0,600);
        el('detail').dataset.phase = stage;
    }
    async function bounded(promise, milliseconds = 45000) {
        let timer;
        try { return await Promise.race([promise, new Promise((_, reject) => timer = setTimeout(() => reject(new Error('浏览器推送服务在 45 秒内未响应')), milliseconds))]); }
        finally { clearTimeout(timer); }
    }
    async function api(path, body) {
        const response = await fetch(path, {credentials: 'same-origin', cache: 'no-store', signal: AbortSignal.timeout(15000), ...(body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {})});
        const result = await response.json();
        if (!response.ok) { const error = new Error(result.error || '电脑请求未成功'); error.status = response.status; throw error; }
        return result;
    }
    async function prepare() {
        permission();
        try {
            config = await api('/api/notifications');
            el('computer').textContent = '已连接'; el('pairForm').hidden = true;
            if (!supported) throw new Error('此浏览器不支持系统推送通知');
            await navigator.serviceWorker.register('/sw.js', {scope: '/'});
            registration = await bounded(navigator.serviceWorker.ready);
            const subscription = await registration.pushManager.getSubscription();
            const id = YantuEnvironment.storage.getItem('yantu-push-device');
            const active = subscription && config.devices.some(device => device.id === id && device.active);
            el('subscription').textContent = active ? '本机已登记' : subscription ? '浏览器已注册，尚未登记到电脑' : '本机尚未订阅';
            el('detail').textContent = '连接检查已完成'; el('subscribe').disabled = false;
        } catch (error) {
            if (error.status === 401) { el('computer').textContent = '尚未配对'; el('pairForm').hidden = false; }
            failed('连接检查', error);
        }
    }
    el('pairForm').onsubmit = async event => {
        event.preventDefault();
        try { await api('/api/pair', {code:el('code').value.trim()}); el('code').value = ''; await prepare(); }
        catch (error) { failed('电脑配对', error); }
    };
    el('subscribe').onclick = async () => {
        if (busy) return;
        busy = true; el('subscribe').disabled = true;
        let stage = '通知授权';
        try {
            const granted = await Notification.requestPermission(); permission();
            if (granted !== 'granted') throw new Error('未取得本机通知权限');
            stage = '浏览器推送服务注册'; el('detail').textContent = stage + '中';
            const key = config.publicKey;
            const bytes = Uint8Array.from(atob(key.replace(/-/g,'+').replace(/_/g,'/') + '='.repeat((4-key.length%4)%4)), value => value.charCodeAt(0));
            const subscription = await bounded((async () => await registration.pushManager.getSubscription() || await registration.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:bytes}))());
            stage = '登记到电脑'; el('detail').textContent = stage + '中';
            const result = await api('/api/push/subscribe', {subscription:subscription.toJSON(),name:'安卓手机'});
            YantuEnvironment.storage.setItem('yantu-push-device', result.id);
            el('subscription').textContent = '本机已登记'; el('detail').textContent = '已订阅电脑提醒'; el('detail').dataset.phase = 'complete';
        } catch (error) { failed(stage, error); }
        finally { busy = false; el('subscribe').disabled = false; }
    };
    prepare();
})();
</script>
</body>
</html>
