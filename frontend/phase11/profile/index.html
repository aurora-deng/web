<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>个人主页 · Nebula</title><link rel="stylesheet" href="/phase11/profile/ProfileApp/ProfileApp.css?v=144f1e6009a3d461"><link rel="stylesheet" href="/phase11/shared/DesignSystem/tokens.css?v=144f1e6009a3d461"><link rel="stylesheet" href="/phase11/shared/DesignSystem/base.css?v=144f1e6009a3d461"><link rel="stylesheet" href="/phase11/shared/DesignSystem/workspaces.css?v=144f1e6009a3d461"></head>
<body data-workspace="profile"><main class="profile-workspace"><aside class="profile-summary"><div class="profile-cover"></div><span id="public-avatar" class="profile-avatar">N</span><h1 id="public-name">正在连接…</h1><p id="public-handle"></p><p id="public-biography"></p><nav><button data-section="timeline" class="active">个人动态</button><button data-section="information">基本信息</button><button id="favorites-tab" data-section="favorites" hidden>我的收藏</button></nav><a href="/phase11/tree/">去树下看看 ↗</a></aside>
<section class="profile-content"><header><div><p class="eyebrow">A SMALL PIECE OF MY WORLD</p><h2 id="section-title">日常，有迹可循</h2></div><button id="publish-activity" hidden>＋ 分享此刻</button></header><p id="profile-status" role="status"></p>
<section id="timeline-section"><div class="timeline-filters"><button data-channel="all" class="active">全部动态</button><button data-channel="tree">树上故事</button></div><div id="activity-list"></div><button id="older-activities" hidden>查看更早的日常</button></section>
<section id="information-section" hidden><article class="information-card"><h3>对外资料</h3><dl id="public-information"></dl><p>只展示已开放的资料，账号凭据不会出现在此页面。</p></article><form id="profile-edit-form" class="information-card" hidden><h3>基本信息</h3><label>用户名<input name="username" readonly></label><label>显示名称<input name="displayName" maxlength="64" required></label><label>个人简介<textarea name="biography" maxlength="240" rows="4"></textarea></label><label class="checkbox-label"><input name="showBiography" type="checkbox">在对外主页展示简介</label><label class="checkbox-label"><input name="showAvatar" type="checkbox">在对外主页展示头像</label><label class="checkbox-label"><input name="allowTreeFriendRequests" type="checkbox">允许其他人通过我的树上果实申请加好友（默认关闭）</label><button type="submit">保存资料</button><a href="/phase11/?editProfile=1">更换头像</a><p>这是本人专属设置区域；登录与安全仍由安全会话管理。</p></form></section>
</section></main>
<dialog id="profile-publish-dialog"><form id="profile-publish-form"><header><div><p class="eyebrow">SHARE A MOMENT</p><h2>留住这一刻</h2></div><button type="button" data-close-publisher>×</button></header><label>你的日常<textarea name="body" maxlength="2000" rows="5" placeholder="一段文字、一张照片，或一段声音…"></textarea></label><div class="publisher-metadata"><label>分类<select name="categoryId" id="profile-publish-category"><option value="0">不分类（仅主页）</option></select></label><label>心情<input name="mood" maxlength="16" placeholder="此刻的心情"></label><label>标签<input name="tags" placeholder="用空格分开"></label></div><label>图片与语音<input id="profile-media-files" type="file" multiple accept="image/png,image/jpeg,image/gif,image/webp,audio/wav,audio/mpeg,audio/ogg,audio/webm"></label><p>最多六张图片和一段 60 秒语音；内容不会自动进入训练数据。</p><p id="profile-publish-status" role="status"></p><footer><button type="button" data-close-publisher>取消</button><button type="submit">发布动态</button></footer></form></dialog>
<div id="profile-announcements" aria-live="polite"></div><script type="module" src="/phase11/profile/ProfileApp/ProfileApp.js?v=144f1e6009a3d461"></script></body></html>
