name: Verify source

# Reusable lane; dispatch and ordering stay in ci.yml.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  source:
    name: Source and Observer · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source, frontend and Observer contracts
        run: python scripts/project/ci_checks.py source --observer-http
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-evidence-${{ matrix.os }}-${{ github.run_attempt }}
          path: build-function3/ci-report.json
          if-no-files-found: error
          retention-days: 7
