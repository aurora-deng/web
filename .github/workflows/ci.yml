name: Verify and package NEBULA

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      run_business:
        description: 'Run Linux business and OTLP tests, then prepare a delivery artifact'
        type: boolean
        default: false
      run_native:
        description: 'Also verify the installed native toolchain and package both Workers'
        type: boolean
        default: false
      run_fleet:
        description: 'Run C++ gRPC fleet processes against their isolated SQLite ledgers'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

# New lanes register a local reusable workflow and a catalog entry.
jobs:
  source:
    uses: ./.github/workflows/verify-source.yml

  cpp-systems:
    uses: ./.github/workflows/verify-cpp-systems.yml

  fleet-grpc:
    if: github.event_name == 'workflow_dispatch' && inputs.run_fleet
    uses: ./.github/workflows/verify-fleet-grpc.yml

  business:
    needs: source
    if: github.event_name == 'workflow_dispatch' && (inputs.run_business || inputs.run_native)
    uses: ./.github/workflows/verify-business.yml

  native:
    needs: business
    if: github.event_name == 'workflow_dispatch' && inputs.run_native
    uses: ./.github/workflows/verify-native.yml
