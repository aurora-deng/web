name: source-and-business

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
    inputs:
      run_business:
        description: 'Run the provisioned Linux business reproduction on the isolated runner'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Source and frontend contracts (no installation)
        run: python3 scripts/project/ci_checks.py source
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-evidence
          path: build-function3/ci-report.json
  business:
    # Opt-in only: a green source job is not evidence that this runner exists
    # or that real PostgreSQL and WebSocket checks ran.
    if: github.event_name == 'workflow_dispatch' && inputs.run_business
    runs-on: [self-hosted, linux, webserver-isolated-ci]
    environment: isolated-ci
    timeout-minutes: 30
    env:
      PG_PREFIX: ${{ vars.WEB_CI_POSTGRES_PREFIX }}
      SODIUM_PREFIX: ${{ vars.WEB_CI_SODIUM_PREFIX }}
      GTEST_DIR: ${{ vars.WEB_CI_GTEST_DIR }}
      SSL_INCLUDE: ${{ vars.WEB_CI_OPENSSL_INCLUDE }}
      SSL_LIB_DIR: ${{ vars.WEB_CI_OPENSSL_LIB_DIR }}
    steps:
      - uses: actions/checkout@v4
      - name: Clean Release build and real disposable PostgreSQL
        shell: bash
        run: |
          args=(--postgres-prefix "${PG_PREFIX:?Configure WEB_CI_POSTGRES_PREFIX on the isolated runner}")
          if [[ -n "$SODIUM_PREFIX" ]]; then args+=(--sodium-prefix "$SODIUM_PREFIX"); fi
          if [[ -n "$GTEST_DIR" ]]; then args+=(--gtest-dir "$GTEST_DIR"); fi
          if [[ -n "$SSL_INCLUDE" || -n "$SSL_LIB_DIR" ]]; then
            args+=(--openssl-include "${SSL_INCLUDE:?}" --openssl-lib-dir "${SSL_LIB_DIR:?}")
          fi
          python3 scripts/project/reproduce.py business \
            --build-dir "build/ci-business-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: business-evidence
          path: build/ci-business-*/reproduction.json
